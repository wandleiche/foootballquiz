name: Datenbank & Fotos aktualisieren

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Daten & Fotos aktualisieren
        run: python full_update_and_transfer_check.py

      - name: Geaenderte Datenbank committen
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Automatische Datenaktualisierung'
          file_pattern: 'football_quiz_complete.json'
